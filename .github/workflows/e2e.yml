name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:30 UTC daily. A nightly run against the same commit is how you find flakes:
    # a test that only fails once a week never fails on the PR that introduced it.
    - cron: '30 6 * * *'

concurrency:
  # A new push supersedes the old run. Four shards times three browsers is not something
  # you want queued up twice for a branch nobody is looking at any more.
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHARD_TOTAL: 4
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gates first. If the suite does not compile, or somebody reintroduced a
  # hard-coded sleep, fail in 40 seconds instead of after 12 browser jobs.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fail on hard-coded waits
        # The one rule this framework will not bend on. `waitForTimeout` anywhere in the
        # suite is a merge blocker, not a code-review comment somebody might forget.
        run: npm run lint:no-hard-waits

  # ---------------------------------------------------------------------------
  # The suite itself, split four ways. Each shard is an independent machine that
  # runs a quarter of the tests and emits a blob report.
  # ---------------------------------------------------------------------------
  test:
    name: Shard ${{ matrix.shard }}/4
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Never cancel siblings: if shard 2 fails, shards 1, 3 and 4 must still finish so
      # the merged report shows the whole picture rather than a truncated one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out the test framework
        uses: actions/checkout@v4
        with:
          path: playwright-framework

      - name: Check out the app under test
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/flakeboard
          path: flakeboard

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            playwright-framework/package-lock.json
            flakeboard/package-lock.json

      - name: Install app dependencies
        working-directory: flakeboard
        run: npm ci

      - name: Install suite dependencies
        working-directory: playwright-framework
        run: npm ci

      # Cache the browser binaries, keyed on the Playwright version in the lockfile.
      # Downloading three browsers on every shard of every run is roughly a minute each,
      # four times over, for no reason.
      - name: Resolve Playwright version
        id: pw
        working-directory: playwright-framework
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        working-directory: playwright-framework
        run: npx playwright install --with-deps

      - name: Install browser system dependencies
        # On a cache hit the binaries are already on disk, but the OS-level libraries are
        # not part of the cached directory and still have to be installed.
        if: ${{ steps.browser-cache.outputs.cache-hit == 'true' }}
        working-directory: playwright-framework
        run: npx playwright install-deps

      - name: Run shard ${{ matrix.shard }}
        working-directory: playwright-framework
        env:
          CI: true
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:3001
        # The `webServer` block in playwright.config.ts starts the app and waits on
        # /api/health, so there is no sleep-and-hope step here either.
        run: npx playwright test --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

      - name: Upload blob report
        # `always()` matters: the report from a failing shard is the one you actually
        # want to read.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: playwright-framework/blob-report
          retention-days: 14

      - name: Upload traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: traces-shard-${{ matrix.shard }}
          path: playwright-framework/test-results
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stitch the four blob reports into one HTML report and publish it.
  # ---------------------------------------------------------------------------
  merge-report:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter=html,github ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  # ---------------------------------------------------------------------------
  # Publish to GitHub Pages so the report has a permanent, linkable home.
  # ---------------------------------------------------------------------------
  publish-report:
    name: Publish report to Pages
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: merge-report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # One line in the PR checks that says whether the suite passed, without making
  # the reviewer open four shard logs.
  # ---------------------------------------------------------------------------
  summary:
    name: E2E result
    if: ${{ always() }}
    needs: [test, merge-report]
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "### Playwright E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Shards: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merged report: ${{ needs.merge-report.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published report: https://${{ github.repository_owner }}.github.io/playwright-framework/" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test.result }}" != "success" ]; then exit 1; fi
